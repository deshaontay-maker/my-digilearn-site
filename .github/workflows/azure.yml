# Tests the site, builds it, and deploys it to your Azure Static Web App on every push to main.
# The deployment token is the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN: it is never in this file.
name: Azure

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run the tests
        run: node --test
      - name: Build the site and version.json
        run: node scripts/build.js
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
